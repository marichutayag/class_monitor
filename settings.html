<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings · Class Monitor</title>
  <link rel="icon" href="assets/gc-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&display=block">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/settings.css">
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <div class="band">
    <header class="topbar">
      <a class="brand" id="brand-link" href="index.html">
        <img src="assets/gc-logo.png" alt="Gordon College logo">
        <span>Class Monitor</span>
      </a>
      <div class="profile">
        <button class="profile-btn user-initials" id="profile-btn" type="button" aria-label="Open profile menu" aria-expanded="false" aria-controls="profile-menu"></button>
        <div class="profile-menu" id="profile-menu">
          <div class="menu-user">
            <span class="avatar user-initials"></span>
            <div>
              <strong id="menu-name"></strong>
              <small id="menu-role"></small>
            </div>
          </div>
          <a class="menu-item" href="settings.html">
            <span class="material-symbols-rounded" aria-hidden="true">settings</span>
            Settings
          </a>
          <button class="menu-item logout" id="logout-btn" type="button">
            <span class="material-symbols-rounded" aria-hidden="true">logout</span>
            Log out
          </button>
        </div>
      </div>
    </header>

    <section class="hero narrow">
      <a class="back-link" id="back-link" href="index.html">
        <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
        Back
      </a>
      <h1>Settings</h1>
    </section>
  </div>

  <main class="container narrow">
    <div class="column">
      <section class="card">
        <div class="profile-card">
          <span class="avatar large user-initials"></span>
          <div>
            <h2 id="profile-name"></h2>
            <p class="muted" id="profile-email"></p>
          </div>
        </div>
        <dl class="details">
          <div>
            <dt>Role</dt>
            <dd id="profile-role"></dd>
          </div>
          <div>
            <dt>Class</dt>
            <dd id="profile-class"></dd>
          </div>
          <div id="id-row">
            <dt>Student ID</dt>
            <dd id="profile-id"></dd>
          </div>
        </dl>
      </section>

      <section class="card">
        <div class="card-head">
          <div class="card-title">
            <span class="icon-chip"><span class="material-symbols-rounded" aria-hidden="true">palette</span></span>
            <div>
              <h2>Dashboard Color</h2>
            </div>
          </div>
        </div>
        <div class="themes">
          <label class="theme-option">
            <input type="radio" name="theme" value="green">
            <span class="swatch green"><span class="material-symbols-rounded" aria-hidden="true">check</span></span>
            Green
          </label>
          <label class="theme-option">
            <input type="radio" name="theme" value="orange">
            <span class="swatch orange"><span class="material-symbols-rounded" aria-hidden="true">check</span></span>
            Orange
          </label>
          <label class="theme-option">
            <input type="radio" name="theme" value="blue">
            <span class="swatch blue"><span class="material-symbols-rounded" aria-hidden="true">check</span></span>
            Blue
          </label>
          <label class="theme-option">
            <input type="radio" name="theme" value="pink">
            <span class="swatch pink"><span class="material-symbols-rounded" aria-hidden="true">check</span></span>
            Pink
          </label>
          <label class="theme-option">
            <input type="radio" name="theme" value="yellow">
            <span class="swatch yellow"><span class="material-symbols-rounded" aria-hidden="true">check</span></span>
            Yellow
          </label>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <div class="card-title">
            <span class="icon-chip"><span class="material-symbols-rounded" aria-hidden="true">restart_alt</span></span>
            <div>
              <h2>Demo Data</h2>
            </div>
          </div>
        </div>
        <button class="btn btn-danger" id="reset-btn" type="button">
          <span class="material-symbols-rounded" aria-hidden="true">delete_sweep</span>
          Reset demo data
        </button>
        <p class="message success" id="reset-message" role="status"></p>
      </section>

      <section class="card about">
        <div class="about-logos">
          <img src="assets/gc-logo.png" alt="Gordon College logo">
          <img src="assets/ccs-logo.png" alt="College of Computer Studies logo">
        </div>
        <h2>Class Monitor</h2>
        <p class="muted">A Web-Based QR Attendance and Punctuality Monitoring System for College Classes</p>
        <p class="about-team">Made by <strong>Ctrl Freaks</strong> · BSCS 1D</p>
      </section>
    </div>
  </main>

  <script src="js/settings.js"></script>
</body>
</html>
