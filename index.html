<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Class Monitor</title>
  <link rel="icon" href="assets/gc-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&display=block">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</head>
<body class="login-page">
  <section class="login-brand">
    <div class="login-logo">
      <img src="assets/gc-logo.png" alt="Gordon College logo">
      <span>Class Monitor</span>
    </div>

    <div class="login-intro">
      <h1>Class attendance, <span>made simple.</span></h1>
      <ul class="login-features">
        <li><span class="material-symbols-rounded" aria-hidden="true">qr_code_2</span>Time in with your own QR code</li>
        <li><span class="material-symbols-rounded" aria-hidden="true">schedule</span>Automatic Present, Late and Absent records</li>
      </ul>
    </div>

    <div class="login-school">
      <img src="assets/ccs-logo.png" alt="College of Computer Studies logo">
      <span>Gordon College<br>College of Computer Studies</span>
    </div>
  </section>

  <main class="login-panel">
    <form class="login-card" id="login-form">
      <h2>Welcome back</h2>

      <div class="field">
        <label for="email">Email</label>
        <div class="input-icon">
          <span class="material-symbols-rounded" aria-hidden="true">mail</span>
          <input class="input" type="email" id="email" placeholder="you@gordoncollege.edu.ph" autocomplete="username" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-icon">
          <span class="material-symbols-rounded" aria-hidden="true">lock</span>
          <input class="input" type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
        </div>
      </div>

      <p class="message error" id="login-error" role="alert"></p>

      <button class="btn btn-primary btn-block" type="submit">
        Sign in
        <span class="material-symbols-rounded" aria-hidden="true">arrow_forward</span>
      </button>
    </form>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
